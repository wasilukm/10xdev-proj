pre-commit:
  commands:
    format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: DJANGO_SECRET_KEY=mypy DATABASE_URL=postgres://u:p@localhost:5432/db uv run mypy .
    typecheck-reviewer:
      run: cd packages/code_reviewer && uv run mypy .
