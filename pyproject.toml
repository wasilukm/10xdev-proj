[project]
name = "envbooker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.5",
    "lefthook>=2.1.9",
    "ruff>=0.15.17",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["*.migrations.*", "*.tests", "*.tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "accounts.models",
    "catalog.models",
    "reservations.models",
    "catalog.services",
    "reservations.services",
    "catalog.views",
    "reservations.views",
    "accounts.views",
    "accounts.forms",
    "reservations.forms",
]
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "envbooker.settings"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
