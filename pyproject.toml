[project]
name = "envbooker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.5",
    "lefthook>=2.1.9",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.17",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^packages/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*", "*.tests", "*.tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "accounts.models",
    "catalog.models",
    "reservations.models",
    "catalog.services",
    "reservations.services",
    "catalog.views",
    "reservations.views",
    "accounts.views",
    "accounts.forms",
    "reservations.forms",
]
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "envbooker.settings"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "envbooker.settings"
testpaths = ["tests/e2e"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end browser tests (require live server + Chromium)",
]
env = [
    "D:DJANGO_SECRET_KEY=test-secret-key-not-for-production",
    "D:DATABASE_URL=postgres://envbooker:envbooker@localhost:5432/envbooker",
    # Ubuntu 26.04 is not yet officially supported by Playwright 1.60;
    # the ubuntu24.04 binaries are ABI-compatible and work correctly.
    "D:PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64",
    # Playwright's internal event loop triggers Django's async-unsafe guard
    # when ORM fixtures run inside a playwright test. This is safe for tests.
    "D:DJANGO_ALLOW_ASYNC_UNSAFE=true",
]

[tool.ruff.format]
