{% extends "base.html" %}

{% block title %}EnvBooker — Environments{% endblock %}

{% block content %}
<h1>Environments</h1>

<form method="get" action="{% url 'home' %}"
      hx-get="{% url 'home' %}"
      hx-target="#env-results"
      hx-swap="outerHTML"
      hx-push-url="true">
  <label for="id_availability">Availability:</label>
  <select name="availability" id="id_availability">
    <option value="">Any</option>
    <option value="free" {% if filters.availability == "free" %}selected{% endif %}>Free now</option>
    <option value="busy" {% if filters.availability == "busy" %}selected{% endif %}>Busy now</option>
  </select>

  <label for="id_project">Project:</label>
  <select name="project" id="id_project">
    <option value="">Any</option>
    {% for p in options.projects %}
      <option value="{{ p }}" {% if filters.project == p %}selected{% endif %}>{{ p }}</option>
    {% endfor %}
  </select>

  <label for="id_use_case_tag">Tag:</label>
  <select name="use_case_tag" id="id_use_case_tag">
    <option value="">Any</option>
    {% for t in options.use_case_tags %}
      <option value="{{ t }}" {% if filters.use_case_tag == t %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>

  <button type="submit">Filter</button>
  <a href="{% url 'home' %}">Clear filters</a>
</form>

{% include "catalog/_environment_results.html" %}
{% endblock %}
