{% extends "base.html" %}
{% block title %}Sign In — EnvBooker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <form class="form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Sign in</button>
    </div>
  </form>
  <p class="auth-alt"><a class="btn-link" href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
