{% extends "base.html" %}
{% block title %}Sign Up — EnvBooker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <form class="form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Sign up</button>
    </div>
  </form>
  <p class="auth-alt"><a class="btn-link" href="{% url 'login' %}">Already have an account? Sign in</a></p>
</div>
{% endblock %}
